<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111111" />
    <title>Derzeit offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111111;
        color: #f4f1ed;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 540px);
        padding: clamp(32px, 8vw, 64px);
        border: 1px solid #37322d;
        border-radius: 20px;
        background: #171717;
        text-align: center;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        font-weight: 500;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: #b9b4ad;
        font-size: 1rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Diese Website ist derzeit offline.</h1>
      <p>Bitte versuchen Sie es zu einem späteren Zeitpunkt erneut.</p>
    </main>
  </body>
</html>
