name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read site mode
        id: site-mode
        run: |
          mode="$(cat SITE_MODE)"
          case "$mode" in
            online|offline) ;;
            *) echo "SITE_MODE must be 'online' or 'offline'" >&2; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.site-mode.outputs.mode == 'online'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.site-mode.outputs.mode == 'online'
        run: npm ci

      - name: Build Astro
        if: steps.site-mode.outputs.mode == 'online'
        run: npm run build

      - name: Prepare offline site
        if: steps.site-mode.outputs.mode == 'offline'
        run: |
          mkdir -p dist
          cp offline/index.html offline/404.html offline/robots.txt offline/CNAME dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
